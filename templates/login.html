{% extends "base.html" %}
{% block title %}Accedi - Spark{% endblock %}

{% block content %}
<div class="max-w-md mx-auto pt-8">
    <div class="text-center mb-8">
        <div class="text-4xl mb-3">💘</div>
        <h1 class="text-2xl font-bold text-gray-900">Bentornato</h1>
        <p class="text-gray-500 text-sm mt-1">Accedi al tuo account</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-600 px-4 py-3 rounded-xl mb-5 text-sm font-medium">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input type="email" name="email" required
                   class="w-full border border-gray-200 rounded-xl px-4 py-3.5 bg-white focus:ring-2 focus:ring-spark-400 outline-none"
                   placeholder="tua@email.com">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <input type="password" name="password" required
                   class="w-full border border-gray-200 rounded-xl px-4 py-3.5 bg-white focus:ring-2 focus:ring-spark-400 outline-none"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full btn-primary text-white font-semibold py-4 rounded-xl mt-2">
            Accedi
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-8">
        Non hai un account?
        <a href="/register" class="text-spark-500 font-semibold">Registrati</a>
    </p>
</div>
{% endblock %}
