<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi – MyCheating</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .btn-red {
            background: linear-gradient(90deg, #e11d48, #be123c);
        }
        .btn-red:hover {
            background: linear-gradient(90deg, #be123c, #9f1239);
        }
        input:focus {
            outline: none;
            border-color: #e11d48;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <!-- Titolo -->
        <div class="mb-10">
            <h1 class="text-4xl font-bold text-white tracking-tight">
                ACCEDI
            </h1>
            <div class="w-12 h-1 bg-red-600 mt-2 mb-4"></div>
            <p class="text-gray-400 text-sm">
                Bentornato. Il tuo mondo ti aspetta.
            </p>
        </div>

        <!-- Errore -->
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-lg mb-6">
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="post" action="/login" class="space-y-4">
            <div>
                <input type="email" name="email" required
                       placeholder="Email"
                       class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3.5 text-sm transition">
            </div>
            <div>
                <input type="password" name="password" required
                       placeholder="Password"
                       class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3.5 text-sm transition">
            </div>

            <button type="submit"
                    class="w-full btn-red text-white font-semibold py-3.5 rounded-lg mt-2 tracking-wide">
                ENTRA
            </button>
        </form>

        <!-- Link registrazione -->
        <p class="text-center text-sm text-gray-500 mt-8">
            Prima volta qui?
            <a href="/register" class="text-red-500 hover:text-red-400 font-medium">Registrati gratis</a>
        </p>
    </div>

</body>
</html>
