<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo – MyCheating</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; font-family: 'Oswald', sans-serif; }
        .font-hot { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
        .text-red-pure { color: #ff1a1a; }
        input:focus, select:focus, textarea:focus { border-color: #ff1a1a !important; outline: none; }
    </style>
</head>
<body class="text-white min-h-screen pb-24">

    <!-- Top bar -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
        <div class="font-hot text-xl tracking-wider flex items-center gap-2">
            <span class="text-red-pure">🔥</span> MY CHEATING
        </div>
        <a href="/logout" class="text-sm text-red-pure">Esci</a>
    </div>

    <div class="max-w-md mx-auto px-4 py-6">

        <!-- Header profilo -->
        <div class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 flex items-center gap-4">
            <div class="w-20 h-20 rounded-full bg-gradient-to-br from-red-700 to-black flex items-center justify-center text-3xl font-hot">
                {{ user.nome[0] | upper }}
            </div>
            <div>
                <div class="font-hot text-2xl tracking-wide">{{ user.nome }}, {{ user.eta }}</div>
                <div class="text-gray-400 text-sm">@{{ user.username }}</div>
                {% if user.citta %}<div class="text-gray-500 text-sm mt-1">📍 {{ user.citta }}</div>{% endif %}
            </div>
        </div>

        <!-- Form modifica -->
        <form method="post" action="/profile/update" class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 space-y-4">
            <h2 class="font-hot text-xl tracking-wide mb-2">INFORMAZIONI</h2>

            <textarea name="bio" rows="3" placeholder="Bio"
                      class="w-full bg-transparent border border-white/15 text-white placeholder-gray-500 rounded-xl px-4 py-3 text-sm resize-none">{{ user.bio or '' }}</textarea>

            <input type="text" name="citta" value="{{ user.citta or '' }}" placeholder="Città"
                   class="w-full bg-transparent border border-white/15 text-white placeholder-gray-500 rounded-xl px-4 py-3 text-sm">

            <div class="grid grid-cols-2 gap-3">
                <input type="number" name="altezza" value="{{ user.altezza or '' }}" placeholder="Altezza (cm)"
                       class="w-full bg-transparent border border-white/15 text-white placeholder-gray-500 rounded-xl px-4 py-3 text-sm">
                <select name="cerca" class="w-full bg-[#0a0a0a] border border-white/15 text-white rounded-xl px-4 py-3 text-sm">
                    <option value="">Cosa cerchi</option>
                    <option value="relazione seria" {% if user.cerca == 'relazione seria' %}selected{% endif %}>Relazione seria</option>
                    <option value="casual" {% if user.cerca == 'casual' %}selected{% endif %}>Casual</option>
                    <option value="amicizia" {% if user.cerca == 'amicizia' %}selected{% endif %}>Amicizia</option>
                    <option value="altro" {% if user.cerca == 'altro' %}selected{% endif %}>Altro</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-[#ff1a1a] text-white font-semibold py-3.5 rounded-xl tracking-wide">
                SALVA
            </button>
        </form>

        <!-- Interessi -->
        <form method="post" action="/profile/interessi" class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-6">
            <h2 class="font-hot text-xl tracking-wide mb-4">INTERESSI</h2>
            <div class="flex flex-wrap gap-2 mb-5">
                {% for i in all_interests %}
                <label class="cursor-pointer">
                    <input type="checkbox" name="interessi" value="{{ i.id }}" class="peer sr-only"
                           {% if i.nome in interessi %}checked{% endif %}>
                    <span class="inline-block px-3 py-1.5 rounded-full text-sm border transition
                                 peer-checked:bg-[#ff1a1a] peer-checked:text-white peer-checked:border-[#ff1a1a]
                                 bg-white/5 text-gray-400 border-white/15">
                        {{ i.nome }}
                    </span>
                </label>
                {% endfor %}
            </div>
            <button type="submit" class="w-full bg-white/10 text-white font-semibold py-3 rounded-xl">
                AGGIORNA INTERESSI
            </button>
        </form>
    </div>

    <!-- Bottom nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-white/10">
        <div class="max-w-md mx-auto grid grid-cols-4 h-16 text-xs">
            <a href="/discover" class="flex flex-col items-center justify-center text-gray-500">
                <span class="text-lg">🔥</span> Scopri
            </a>
            <a href="/matches" class="flex flex-col items-center justify-center text-gray-500">
                <span class="text-lg">♥</span> Match
            </a>
            <a href="/notifications" class="flex flex-col items-center justify-center text-gray-500">
                <span class="text-lg">💬</span> Chat
            </a>
            <a href="/profile" class="flex flex-col items-center justify-center text-red-pure">
                <span class="text-lg">👤</span> Profilo
            </a>
        </div>
    </nav>
</body>
</html>
