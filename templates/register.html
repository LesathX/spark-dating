{% extends "base.html" %}
{% block title %}Registrati - Spark{% endblock %}

{% block content %}
<div class="max-w-md mx-auto pt-4 pb-8">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Crea il tuo account</h1>
        <p class="text-gray-500 text-sm mt-1">Unisciti a Spark in pochi secondi</p>
    </div>

    {% if error %}
    <div class="bg-red-50 text-red-600 px-4 py-3 rounded-xl mb-5 text-sm font-medium">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                <input type="text" name="nome" required
                       class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                       class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required minlength="6"
                   class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Data di nascita</label>
            <input type="date" name="data_nascita" required
                   class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Genere</label>
                <select name="genere" required
                        class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none bg-white">
                    <option value="">Scegli...</option>
                    <option value="uomo">Uomo</option>
                    <option value="donna">Donna</option>
                    <option value="non-binario">Non-binario</option>
                    <option value="altro">Altro</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Orientamento</label>
                <select name="orientamento" required
                        class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none bg-white">
                    <option value="">Scegli...</option>
                    <option value="etero">Etero</option>
                    <option value="gay">Gay</option>
                    <option value="lesbica">Lesbica</option>
                    <option value="bi">Bi</option>
                    <option value="altro">Altro</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Città (opzionale)</label>
            <input type="text" name="citta"
                   class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bio (opzionale)</label>
            <textarea name="bio" rows="3" placeholder="Racconta qualcosa di te..."
                      class="w-full border border-gray-200 rounded-xl px-3 py-3 focus:ring-2 focus:ring-spark-400 outline-none resize-none"></textarea>
        </div>

        <button type="submit"
                class="w-full btn-primary text-white font-semibold py-4 rounded-xl shadow-lg shadow-spark-200 active:scale-[0.98] transition mt-2">
            Registrati
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
        Hai già un account?
        <a href="/login" class="text-spark-500 font-semibold hover:underline">Accedi</a>
    </p>
</div>
{% endblock %}
