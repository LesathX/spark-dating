<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati – MyCheating</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; font-family: 'Oswald', sans-serif; }
        .font-hot { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
        .btn-red { background: #ff1a1a; }
        .btn-red:hover { background: #e60000; }
        .text-red-pure { color: #ff1a1a; }
        input:focus, select:focus, textarea:focus { border-color: #ff1a1a !important; outline: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">
        <div class="mb-8 text-center">
            <h1 class="font-hot text-5xl text-white tracking-wide">REGISTRATI</h1>
            <div class="w-16 h-1 bg-[#ff1a1a] mx-auto mt-2 mb-3"></div>
            <p class="text-gray-400 text-sm">Crea il tuo account gratis</p>
        </div>

        <form method="post" action="/register" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <input type="text" name="nome" required placeholder="Nome"
                       class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm">
                <input type="text" name="username" required placeholder="Username"
                       class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm">
            </div>

            <input type="email" name="email" required placeholder="Email"
                   class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm">

            <input type="password" name="password" required placeholder="Password" minlength="6"
                   class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm">

            <input type="date" name="data_nascita" required
                   class="w-full bg-transparent border border-white/20 text-white rounded-lg px-4 py-3 text-sm">

            <div class="grid grid-cols-2 gap-3">
                <select name="genere" required class="w-full bg-[#0a0a0a] border border-white/20 text-white rounded-lg px-4 py-3 text-sm">
                    <option value="">Genere</option>
                    <option value="uomo">Uomo</option>
                    <option value="donna">Donna</option>
                    <option value="non-binario">Non-binario</option>
                    <option value="altro">Altro</option>
                </select>
                <select name="orientamento" required class="w-full bg-[#0a0a0a] border border-white/20 text-white rounded-lg px-4 py-3 text-sm">
                    <option value="">Orientamento</option>
                    <option value="etero">Etero</option>
                    <option value="gay">Gay</option>
                    <option value="lesbica">Lesbica</option>
                    <option value="bi">Bi</option>
                    <option value="altro">Altro</option>
                </select>
            </div>

            <input type="text" name="citta" placeholder="Città (opzionale)"
                   class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm">

            <textarea name="bio" rows="3" placeholder="Bio (opzionale)"
                      class="w-full bg-transparent border border-white/20 text-white placeholder-gray-500 rounded-lg px-4 py-3 text-sm resize-none"></textarea>

            <button type="submit" class="w-full btn-red text-white font-semibold py-3.5 rounded-lg tracking-wide mt-2">
                CREA ACCOUNT
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-8">
            Hai già un account?
            <a href="/login" class="text-red-pure font-medium hover:underline">Accedi</a>
        </p>
    </div>

</body>
</html>
